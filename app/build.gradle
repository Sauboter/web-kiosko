plugins {
    id 'com.android.application'
}

// Ключ для Google Play (upload key) приходит из секретов GitHub через переменные окружения.
// Если секретов нет — сборка подписывается тестовым ключом из репозитория (только для проверки, не для Play).
def uploadKeystore = System.getenv('WK_KEYSTORE_FILE')

android {
    namespace 'kz.saubot.webkiosko'
    compileSdk 36

    defaultConfig {
        applicationId 'kz.saubot.webkiosko'
        minSdk 26
        targetSdk 36
        // Номер сборки = номер запуска на GitHub, чтобы каждое обновление ставилось поверх старого
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "0.1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        test {
            storeFile rootProject.file('keystore/test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('WK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WK_KEY_ALIAS')
                keyPassword System.getenv('WK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig uploadKeystore ? signingConfigs.upload : signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
